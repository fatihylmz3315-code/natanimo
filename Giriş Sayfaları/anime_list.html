        const grid = document.getElementById('animeGrid');

        function createCard(title) {
            const link = detailLinks[title];
            const card = document.createElement(link ? 'a' : 'article');
            card.className = 'anime-card';
            if (link) {
                card.href = link;
            }
            const src = availableImages[title] || '../Resimler/logo.1.png';
            card.innerHTML = `
                <img src="${src}" alt="${title}" loading="lazy">
                <h3>${title}</h3>
            `;
            return card;
        }

        function renderList(items) {
            grid.innerHTML = '';
            items.forEach(title => grid.appendChild(createCard(title)));
        }

        renderList(animeTitles);

        function getFilteredTitles() {
            const query = document.getElementById('search').value.trim().toLocaleLowerCase('tr');
            const sort = document.getElementById('sort-anime').value;
            let items = animeTitles.filter(title => title.toLocaleLowerCase('tr').includes(query));
            if (sort === 'az') items = [...items].sort((a, b) => a.localeCompare(b, 'tr'));
            if (sort === 'za') items = [...items].sort((a, b) => b.localeCompare(a, 'tr'));
            return items;
        }

        document.getElementById('search').addEventListener('input', () => renderList(getFilteredTitles()));
        document.getElementById('sort-anime').addEventListener('change', () => renderList(getFilteredTitles()));
